<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coptic Manuscripts Museum</title>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Figtree:wght@400;500;600&family=Cairo:wght@400;600&family=Tajawal:wght@400;500;700&family=Amiri&family=Almarai&family=El+Messiri&family=Reem+Kufi&family=Changa&family=Lateef&family=Scheherazade+New&family=Noto+Naskh+Arabic&family=Noto+Kufi+Arabic&family=Aref+Ruqaa&family=Markazi+Text&family=Lalezar&family=Roboto&family=Open+Sans&family=Montserrat&family=Lato&family=Poppins&family=Oswald&family=Raleway&family=Nunito&family=Inter&family=Playfair+Display&family=Merriweather&family=Lora&family=Cormorant+Garamond&family=Cinzel&family=Bebas+Neue&family=Anton&family=Pacifico&family=Dancing+Script&family=Lobster&family=Great+Vibes&family=Abril+Fatface&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--fg:#fff;--teal:#008573;--line:#2a2a2a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:#000;color:#fff;font-family:Figtree,system-ui,sans-serif}
header{display:flex;align-items:center;justify-content:center;padding:34px 20px 26px;border-bottom:1px solid var(--line);background:linear-gradient(#0b0b0b,#000)}
.brand{text-align:center}
.brand b{display:block;font:400 clamp(1.25rem,5.6vw,2.9rem)/1.1 Cinzel,Marcellus,serif;letter-spacing:.3em;padding-left:.3em;text-transform:uppercase;text-align:center}
.brand:after{content:"";display:block;width:72px;height:1px;margin:18px auto 0;background:linear-gradient(90deg,transparent,#d4af37,transparent)}
.hero{position:relative;height:min(78vh,820px);min-height:520px;overflow:hidden}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 30%}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.3) 0,rgba(0,0,0,0) 28%,rgba(0,0,0,.2) 55%,rgba(0,0,0,.92) 100%)}
.hero h1{position:absolute;z-index:2;right:28px;left:28px;bottom:104px;margin:0;text-align:left;font:400 clamp(2.4rem,9.5vw,5.8rem)/1.04 Cinzel,Marcellus,serif;letter-spacing:.06em;text-transform:uppercase;text-shadow:0 2px 24px rgba(0,0,0,.65)}
.hero p{position:absolute;z-index:2;right:28px;left:28px;bottom:58px;margin:0;text-align:left;font:400 clamp(.95rem,3.4vw,1.35rem) Marcellus,serif;letter-spacing:.28em;text-transform:uppercase;color:#e9dcc0;text-shadow:0 1px 12px rgba(0,0,0,.7)}
.hero p:before{content:"";display:inline-block;width:46px;height:1px;background:#d4af37;vertical-align:middle;margin-right:16px}
#bar{position:fixed;left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:9;display:flex;gap:8px}
#bar button{font:600 .85rem Figtree,sans-serif;border:0;border-radius:30px;padding:11px 16px;background:#fff;color:#000;cursor:pointer}
body.edit [contenteditable]{outline:1px dashed #2fae9b;outline-offset:4px}
body.edit .hero{cursor:pointer}
:focus-visible{outline:2px solid #2fae9b;outline-offset:3px}
.tabsec{padding:0 0 120px}
#tbar{display:flex;gap:6px;overflow-x:auto;padding:0 16px;border-bottom:1px solid var(--line)}
#tbar .tb:first-child{margin-left:auto}#tbar .tb:last-child{margin-right:auto}
.tb{font:600 1rem Figtree,sans-serif;background:none;border:0;border-bottom:3px solid transparent;color:#9a9a9a;padding:22px 16px 14px;white-space:nowrap;cursor:pointer}
.tb.on{color:#fff;border-bottom-color:#fff}
#tpanel{max-width:760px;margin:0 auto;padding:28px 20px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.row input{flex:1;min-width:160px;background:#111;border:1px solid #333;color:#fff;border-radius:10px;padding:10px 12px;font:inherit}
.mb{font:600 .85rem Figtree,sans-serif;background:#111;color:#fff;border:1px solid #333;border-radius:30px;padding:9px 14px;cursor:pointer}
.mb.rec{background:#b3261e;border-color:#b3261e}
.blk{margin:0 0 26px}
.tx{font-size:1.15rem;line-height:1.7;white-space:pre-wrap;min-height:1.7em}
.md{display:block;width:100%;max-width:100%;border-radius:14px;background:#111}
audio.md{height:44px;border-radius:30px;background:transparent}
video.md{width:100%;max-width:100%;max-height:none;aspect-ratio:16/9;object-fit:contain;background:#000;margin:0 auto;border-radius:12px}
.ctl{display:flex;gap:6px;margin-top:8px}
.ctl .mb{padding:5px 12px}
.msg{color:#f2b8b5;font-size:.9rem}
.cards{display:grid;gap:12px}
.card{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;background:#0b0b0b;border:1px solid var(--line);color:#fff;border-radius:16px;padding:22px 20px;font:400 1.25rem Marcellus,serif;letter-spacing:.06em;cursor:pointer}
.card span:last-child{color:#2fae9b}
.ptitle{font:400 clamp(2rem,8vw,3.4rem)/1.1 Marcellus,serif;letter-spacing:.04em;text-transform:uppercase;margin:10px 0 24px;overflow-wrap:anywhere}
.pdf{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#111;border:1px solid #333;border-radius:14px;padding:14px 16px}
.pdf span{overflow-wrap:anywhere}
.pdf a{flex:none;color:#fff;background:var(--teal);border-radius:30px;padding:9px 16px;text-decoration:none;font-weight:600;font-size:.9rem}
.empty{color:#9a9a9a}
.pgs canvas{display:block;width:100%;height:auto;margin-top:10px;border-radius:8px;background:#fff}
.pbtn{flex:none;font:600 .9rem Figtree,sans-serif;color:#fff;background:var(--teal);border:0;border-radius:30px;padding:9px 16px;cursor:pointer}
.ovl{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px max(16px,env(safe-area-inset-bottom,0px))}
.mbox{width:100%;max-width:640px;height:min(80vh,760px);background:#0b0b0b;border:1px solid #333;border-radius:18px;display:flex;flex-direction:column;overflow:hidden}
.mhd{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid #2a2a2a}
.mhd span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mhd a{flex:none;color:#fff;background:var(--teal);border-radius:30px;padding:7px 14px;text-decoration:none;font-weight:600;font-size:.85rem}
.xbtn{flex:none;width:34px;height:34px;border-radius:50%;border:0;background:#fff;color:#000;font-size:1rem;cursor:pointer}
.mbd{flex:1;overflow:auto;padding:0 12px 12px}
.blk.main{margin-bottom:34px}
.blk.main img.md{max-height:72vh;object-fit:cover;border-radius:18px}
.blk.main video.md{max-width:100%;max-height:none;aspect-ratio:16/9;border-radius:12px}
body.pg .hero{display:none}
@keyframes kb{from{transform:scale(1.02) translate(0,0)}to{transform:scale(1.14) translate(-1.5%,-1.2%)}}
@keyframes rise{from{opacity:0;translate:0 32px}to{opacity:1;translate:0 0}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes zin{from{transform:scale(1.2);opacity:0}to{transform:scale(1.02);opacity:1}}
@keyframes wm{from{opacity:0;letter-spacing:.7em}to{opacity:1;letter-spacing:.3em}}
@keyframes ln{from{width:0}to{width:72px}}
body.intro .hero img{animation:zin 2.4s cubic-bezier(.2,.7,.2,1) both}
body.intro .brand b{animation:wm 1.8s cubic-bezier(.2,.7,.2,1) both}
body.intro .brand:after{animation:ln 1.4s cubic-bezier(.2,.7,.2,1) .9s both}
body.intro .hero h1{animation:rise 1s cubic-bezier(.2,.7,.2,1) .4s both}
body.intro .hero p{animation:rise 1s cubic-bezier(.2,.7,.2,1) .9s both}
body.edit .hero h1,body.edit .hero p,body.edit .hero img{animation:none!important}
@media (prefers-reduced-motion:reduce){body.intro .hero h1,body.intro .hero p,body.intro .hero img,body.intro .brand b,body.intro .brand:after{animation:fade .8s both}}
.brand{cursor:pointer}
.sel{outline:2px solid #d4af37!important;outline-offset:4px;touch-action:none;cursor:move}
body.dragging,body.dragging *{user-select:none!important;-webkit-user-select:none!important}
body.edit [data-k],body.edit .tx,body.edit .ptitle{cursor:pointer}
#sp{position:fixed;z-index:30;left:12px;right:12px;bottom:calc(68px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto;max-height:34vh;overflow:auto;background:rgba(17,17,17,.94);border:1px solid #333;border-radius:14px;padding:8px 12px;display:grid;align-content:start;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:6px 12px;font-family:Cairo,Figtree,sans-serif}
#sp[hidden]{display:none}
#sp .sph{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;color:#2fae9b}
#sp .spg{display:flex;flex-direction:column;gap:6px;min-width:0}
#sp label{font-size:.85rem;color:#bbb}
#sp output{color:#fff;margin-inline-start:4px}
#sp select,#sp input[type=color]{width:100%;height:32px;background:#0b0b0b;color:#fff;border:1px solid #333;border-radius:10px;padding:0 8px;font:inherit}
#sp input[type=range]{width:100%;accent-color:#2fae9b}
#sp .spc{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
#sp .spc input[type=color]{width:42px;padding:2px}
#sp #spw{display:flex;gap:5px;flex-wrap:wrap}
#sp #spw button{width:24px;height:24px;border-radius:50%;border:1px solid #555;cursor:pointer;padding:0}
#sp .spc .mb{padding:7px 10px}
#sp #spr{grid-column:1/-1}
#sp .spg:has(canvas){grid-column:1/-1}
#sp .wr{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
#sp canvas{width:120px;height:120px;flex:none;border-radius:50%;touch-action:none;cursor:crosshair;background:#222}
#sp .wc{flex:1;min-width:150px;display:flex;flex-direction:column;gap:8px}
#sp input[type=text]{width:100%;height:38px;background:#0b0b0b;color:#fff;border:1px solid #333;border-radius:10px;padding:0 10px;font:inherit;text-transform:uppercase}
#sp #spw{display:flex;gap:6px;flex-wrap:wrap}
#sp .xbtn{width:28px;height:28px;font-size:.85rem}
#sp .sph{gap:8px}
#sp .sph b{flex:1}
#sp.mini>*:not(.sph){display:none}
#sp.mini{height:auto!important}
#sp .sph{cursor:move;touch-action:none}
#fr{position:fixed;z-index:25;border:2px dashed #d4af37;pointer-events:none}
#fr i{position:absolute;width:44px;height:44px;border-radius:50%;background:#d4af37;color:#000;font-style:normal;display:flex;align-items:center;justify-content:center;pointer-events:auto;touch-action:none;font-size:18px;user-select:none;box-shadow:0 1px 6px rgba(0,0,0,.6)}
#fr .fm{left:50%;top:-26px;margin-left:-22px}
#fr .fz{right:-22px;bottom:-22px}
#sp .rz{grid-column:1/-1;position:sticky;bottom:-4px;margin-left:auto;width:36px;height:26px;touch-action:none;cursor:nwse-resize;color:#2fae9b;text-align:center;line-height:26px;font-size:22px;user-select:none}
#sp.mini{padding:6px 12px}
body.sp-open .tabsec{padding-bottom:45vh}
#bar[hidden]{display:none}
.aq{width:100%;background:#111;border:1px solid #333;color:#fff;border-radius:10px;padding:10px 12px;font:inherit;margin-bottom:8px}
.ar{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid #2a2a2a;border-radius:12px;margin-bottom:6px}
.ar img{width:30px;height:30px;border-radius:50%;flex:none}
.ar span{flex:1;overflow-wrap:anywhere}
